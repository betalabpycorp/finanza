<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#0F1220; --surface:#171B2E; --surface-2:#1F2438; --line:#2A2F48;
  --text:#F2F3F7; --muted:#9AA0B4;
  --cyan:#35E7C8; --amber:#FFB648; --magenta:#FF5C8A; --danger:#FF6B6B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; }
button{ font-family:inherit; }
.app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
.topbar{ padding:18px 18px 12px; position:sticky; top:0; background:var(--bg); z-index:10; }
.topbar h1{ font-size:19px; }
.topbar p{ font-size:12px; color:var(--muted); margin:3px 0 0; }
.pages{ flex:1; padding:4px 18px 90px; }
.page{ display:none; }
.page.active{ display:block; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
.card-label{ font-size:12px; color:var(--muted); margin-bottom:4px; }
.card-value{ font-size:24px; font-weight:700; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 14px; }
.stat .card-label{ display:flex; align-items:center; gap:6px; }
.dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.stat .card-value{ font-size:17px; }
.section-title{ font-size:14px; font-weight:600; color:var(--muted); margin:20px 0 10px; text-transform:uppercase; letter-spacing:.03em; }
.quick-actions{ display:flex; gap:8px; margin-top:14px; }
.qbtn{ flex:1; padding:11px 0; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; }
.type-tabs{ display:flex; gap:8px; margin-bottom:16px; }
.type-tab{ flex:1; padding:10px 0; text-align:center; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; }
.type-tab.active.venta{ background:rgba(53,231,200,.15); border-color:var(--cyan); color:var(--cyan); }
.type-tab.active.compra{ background:rgba(255,182,72,.15); border-color:var(--amber); color:var(--amber); }
.type-tab.active.gasto{ background:rgba(255,92,138,.15); border-color:var(--magenta); color:var(--magenta); }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
.field input{ width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; color:var(--text); font-size:14px; font-family:inherit; }
.save-btn{ width:100%; padding:13px 0; border-radius:12px; border:none; background:var(--cyan); color:#04231d; font-size:14px; font-weight:700; cursor:pointer; }
.save-btn:disabled{ opacity:.5; }
.save-msg{ text-align:center; font-size:12px; color:var(--cyan); margin-top:10px; height:14px; }
.hist-row{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
.hist-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
.hist-info{ flex:1; min-width:0; }
.hist-desc{ font-size:13.5px; font-weight:600; }
.hist-date{ font-size:11px; color:var(--muted); margin-top:1px; }
.hist-amount{ font-size:13.5px; font-weight:700; white-space:nowrap; }
.hist-del{ background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:4px 2px; }
.month-sep{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 4px; }
.empty{ text-align:center; padding:40px 10px; color:var(--muted); font-size:13.5px; }
.month-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
.month-card h3{ font-size:14.5px; margin-bottom:10px; text-transform:capitalize; }
.bottom-nav{ position:sticky; bottom:0; display:flex; background:rgba(23,27,46,.94); border-top:1px solid var(--line); padding:8px 4px; }
.nav-btn{ flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); padding:4px 0; font-size:19px; }
.nav-btn span{ font-size:10.5px; font-weight:500; }
.nav-btn.active{ color:var(--cyan); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>💰 MisFinanzas</h1>
    <p id="syncStatus">📊 Cargando desde tu Google Sheet...</p>
  </div>

  <div class="pages">
    <section class="page active" id="page-home">
      <div class="section-title" id="mesActualLabel">Este mes</div>
      <div class="grid2">
        <div class="stat"><div class="card-label"><span class="dot" style="background:var(--cyan)"></span>Ventas</div><div class="card-value" id="homeVentas">Gs. 0</div></div>
        <div class="stat"><div class="card-label"><span class="dot" style="background:var(--amber)"></span>Compras</div><div class="card-value" id="homeCompras">Gs. 0</div></div>
        <div class="stat"><div class="card-label"><span class="dot" style="background:#7CFFB2"></span>Ganancia</div><div class="card-value" id="homeGanancia">Gs. 0</div></div>
        <div class="stat"><div class="card-label"><span class="dot" style="background:var(--magenta)"></span>Gastos</div><div class="card-value" id="homeGastos">Gs. 0</div></div>
      </div>
      <div class="section-title">Acciones rápidas</div>
      <div class="quick-actions">
        <button class="qbtn" onclick="goToAdd('venta')">+ Venta</button>
        <button class="qbtn" onclick="goToAdd('compra')">+ Compra</button>
        <button class="qbtn" onclick="goToAdd('gasto')">+ Gasto</button>
      </div>
      <div class="section-title">Total histórico</div>
      <div class="card">
        <div class="card-label">Ganancia acumulada (ventas − compras)</div>
        <div class="card-value" id="homeGananciaTotal">Gs. 0</div>
      </div>
    </section>

    <section class="page" id="page-add">
      <div class="section-title">Nuevo movimiento</div>
      <div class="type-tabs">
        <button class="type-tab venta" data-type="venta" onclick="setAddType('venta')">Venta</button>
        <button class="type-tab compra" data-type="compra" onclick="setAddType('compra')">Compra</button>
        <button class="type-tab gasto" data-type="gasto" onclick="setAddType('gasto')">Gasto</button>
      </div>
      <div class="field"><label for="addDesc">Descripción</label><input id="addDesc" type="text" placeholder="Ej: PlayStation 5, alquiler..."></div>
      <div class="field"><label for="addAmount">Monto (Gs.)</label><input id="addAmount" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="addDate">Fecha</label><input id="addDate" type="date"></div>
      <button class="save-btn" id="saveBtn" onclick="saveEntry()">Guardar</button>
      <div class="save-msg" id="saveMsg"></div>
    </section>

    <section class="page" id="page-history">
      <div class="section-title">Historial completo</div>
      <div id="historyList"></div>
    </section>

    <section class="page" id="page-months">
      <div class="section-title">Resumen por mes</div>
      <div id="monthsList"></div>
    </section>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-page="home" onclick="goTo('home')">🏠<span>Inicio</span></button>
    <button class="nav-btn" data-page="add" onclick="goTo('add')">➕<span>Registrar</span></button>
    <button class="nav-btn" data-page="history" onclick="goTo('history')">📋<span>Historial</span></button>
    <button class="nav-btn" data-page="months" onclick="goTo('months')">📅<span>Meses</span></button>
  </div>
</div>

<script>
/* ============ DATOS EN MEMORIA (vienen de la Google Sheet) ============ */
let entries = [];

const TYPE_INFO = {
  venta:  { label:"Venta",  color:"var(--cyan)",    sign:"+" },
  compra: { label:"Compra", color:"var(--amber)",   sign:"−" },
  gasto:  { label:"Gasto",  color:"var(--magenta)", sign:"−" },
};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* ============ UTILIDADES ============ */
function money(n){ return "Gs. " + Math.round(n).toLocaleString("es-PY"); }
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){ const [y,m]=key.split("-"); return MESES[parseInt(m,10)-1]+" "+y; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function currentMonthKey(){ return todayStr().slice(0,7); }
function totalsFor(list){
  const t = { venta:0, compra:0, gasto:0 };
  list.forEach(e => { t[e.type] += e.amount; });
  t.ganancia = t.venta - t.compra;
  return t;
}

/* ============ CARGA INICIAL DESDE LA SHEET ============ */
function loadEntries(){
  google.script.run
    .withSuccessHandler(function(list){
      entries = list || [];
      document.getElementById("syncStatus").textContent = "📊 Guardado en tu Google Sheet";
      renderHome();
    })
    .withFailureHandler(function(err){
      document.getElementById("syncStatus").textContent = "⚠️ No se pudo leer la planilla";
      console.error(err);
    })
    .listEntries();
}

/* ============ RENDER: INICIO ============ */
function renderHome(){
  const mk = currentMonthKey();
  document.getElementById("mesActualLabel").textContent = "Este mes · " + monthLabel(mk);
  const t = totalsFor(entries.filter(e => monthKey(e.date) === mk));
  document.getElementById("homeVentas").textContent = money(t.venta);
  document.getElementById("homeCompras").textContent = money(t.compra);
  document.getElementById("homeGanancia").textContent = money(t.ganancia);
  document.getElementById("homeGastos").textContent = money(t.gasto);
  document.getElementById("homeGananciaTotal").textContent = money(totalsFor(entries).ganancia);
}

/* ============ REGISTRAR ============ */
let addType = "venta";
function setAddType(type){
  addType = type;
  document.querySelectorAll(".type-tab").forEach(el => el.classList.toggle("active", el.dataset.type === type));
}
function goToAdd(type){ goTo("add"); setAddType(type); }
function resetAddForm(){
  document.getElementById("addDesc").value = "";
  document.getElementById("addAmount").value = "";
  document.getElementById("addDate").value = todayStr();
}

function saveEntry(){
  const desc = document.getElementById("addDesc").value.trim() || TYPE_INFO[addType].label;
  const amount = parseFloat(document.getElementById("addAmount").value);
  const date = document.getElementById("addDate").value || todayStr();

  if(!amount || amount <= 0){ alert("Ingresá un monto válido, mayor a 0."); return; }

  const data = { type: addType, desc: desc, amount: amount, date: date };
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Guardando...";

  google.script.run
    .withSuccessHandler(function(id){
      entries.push(Object.assign({ id: id }, data));
      btn.disabled = false; btn.textContent = "Guardar";
      const msg = document.getElementById("saveMsg");
      msg.textContent = "Guardado ✓";
      setTimeout(() => { msg.textContent = ""; }, 1800);
      resetAddForm();
      renderHome();
    })
    .withFailureHandler(function(err){
      btn.disabled = false; btn.textContent = "Guardar";
      alert("No se pudo guardar: " + err.message);
    })
    .addEntry(data);
}

/* ============ HISTORIAL ============ */
function deleteEntry(id){
  if(!confirm("¿Eliminar este movimiento?")) return;
  google.script.run
    .withSuccessHandler(function(){
      entries = entries.filter(e => e.id !== id);
      renderHistory(); renderHome(); renderMonths();
    })
    .withFailureHandler(function(err){ alert("No se pudo eliminar: " + err.message); })
    .deleteEntry(id);
}

function renderHistory(){
  const wrap = document.getElementById("historyList");
  if(entries.length === 0){ wrap.innerHTML = '<div class="empty">Todavía no registraste ningún movimiento.</div>'; return; }
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));
  let html = ""; let lastMonth = "";
  sorted.forEach(e => {
    const mk = monthKey(e.date);
    if(mk !== lastMonth){ html += '<div class="month-sep">' + monthLabel(mk) + '</div>'; lastMonth = mk; }
    const info = TYPE_INFO[e.type];
    html += '<div class="hist-row">'
      + '<div class="hist-dot" style="background:' + info.color + '"></div>'
      + '<div class="hist-info"><div class="hist-desc">' + e.desc + '</div>'
      + '<div class="hist-date">' + info.label + ' · ' + e.date + '</div></div>'
      + '<div class="hist-amount" style="color:' + info.color + '">' + info.sign + ' ' + money(e.amount) + '</div>'
      + '<button class="hist-del" onclick="deleteEntry(\'' + e.id + '\')">✕</button></div>';
  });
  wrap.innerHTML = html;
}

/* ============ MESES ============ */
function renderMonths(){
  const wrap = document.getElementById("monthsList");
  if(entries.length === 0){ wrap.innerHTML = '<div class="empty">Todavía no hay meses con movimientos.</div>'; return; }
  const keys = [...new Set(entries.map(e => monthKey(e.date)))].sort().reverse();
  wrap.innerHTML = keys.map(k => {
    const t = totalsFor(entries.filter(e => monthKey(e.date) === k));
    return '<div class="month-card"><h3>' + monthLabel(k) + '</h3><div class="grid2">'
      + '<div class="stat"><div class="card-label"><span class="dot" style="background:var(--cyan)"></span>Ventas</div><div class="card-value">' + money(t.venta) + '</div></div>'
      + '<div class="stat"><div class="card-label"><span class="dot" style="background:var(--amber)"></span>Compras</div><div class="card-value">' + money(t.compra) + '</div></div>'
      + '<div class="stat"><div class="card-label"><span class="dot" style="background:#7CFFB2"></span>Ganancia</div><div class="card-value">' + money(t.ganancia) + '</div></div>'
      + '<div class="stat"><div class="card-label"><span class="dot" style="background:var(--magenta)"></span>Gastos</div><div class="card-value">' + money(t.gasto) + '</div></div>'
      + '</div></div>';
  }).join("");
}

/* ============ NAVEGACIÓN ============ */
function goTo(page){
  document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(el => el.classList.toggle("active", el.dataset.page === page));
  window.scrollTo(0,0);
  if(page === "history") renderHistory();
  if(page === "months") renderMonths();
  if(page === "home") renderHome();
}

/* ============ INICIALIZACIÓN ============ */
resetAddForm();
setAddType("venta");
loadEntries();
</script>
</body>
</html>
